[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "timefuzz"
version = "0.4.0"
description = "Fuzzy, natural-language time parsing that goes past dateparser — resolves phrases like 'sometime next week' into datetimes or ranges, with a confidence score."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Londopy" }]
requires-python = ">=3.10"
keywords = ["datetime", "parsing", "nlp", "fuzzy", "natural-language", "dates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Londopy/timefuzz"

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.4", "tzdata; platform_system == 'Windows'"]

[tool.maturin]
python-source = "python"
module-name = "timefuzz._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than inherited. CI installs ruff unpinned, and
# ruff's *default* selection has grown over time — leaving it implicit means
# a ruff release can turn a green build red without a commit here.
#
# This is the selection the project has always effectively linted against.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The test suite deliberately uses naive datetimes: timefuzz is naive by
# default and only returns tz-aware results when you set `Config(tz=...)`,
# so DTZ-style warnings would argue against the documented behaviour.
"tests/*" = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
